name: Synqra CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run shared tests
        run: npm test
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Save resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-dependencies
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify resolved dependency versions
        run: node scripts/check-resolved-dependencies.mjs
      - name: Build frontend
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Export reviewed lockfile for maintainer commit
        run: node scripts/export-lockfile.mjs
